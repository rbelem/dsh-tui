# Faster dev links via a soft-fail mold wrapper (issues #13/#16): mold is used
# when available (devbox.json provides it on Linux; CI installs it via apt in
# .github/workflows/ci.yml) and the default cc driver is used otherwise, so a
# bare shell without mold never fails. The wrapper appends `-fuse-ld=mold`
# after rustc's own args (gcc honors the last flag). Target-scoped so the
# macOS leg keeps its default linker and is unaffected.
#
# The relative linker path is resolved by cargo against the workspace root
# (verified: `cargo build` from repo root and from src/ both pass an absolute
# `-C linker`), so rustc's CWD is irrelevant for in-workspace builds.
[target.x86_64-unknown-linux-gnu]
linker = ".cargo/mold-linker.sh"
