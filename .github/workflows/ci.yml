name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # mold linker (see .cargo/config.toml) — the rust job also installs
      # llvm-tools-preview, which ships lld as a fallback if apt mold fails.
      - name: install mold
        run: sudo apt-get install -y mold
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets

  # macOS test leg: the e2e harness is portable-pty based (no Linux-only
  # APIs), so the full suite must stay green there too.
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --all-targets

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # mold linker (see .cargo/config.toml); llvm-tools-preview ships lld
      # as a fallback if apt mold fails.
      - name: install mold
        run: sudo apt-get install -y mold
      # Report-only artifact + a fail-under gate ONE POINT BELOW the latest
      # measured number: 94.5 (original) -> 93.47 -> 93.29 -> 93.05 (#19) ->
      # 92.95 (follow-up batch A, 2026-08-15). Gate at 92 absorbs normal
      # drift without blocking regressions above the council target of >=85%
      # lines / >=80% branches. See PARITY.md "## coverage" for the
      # documented exclusions.
      - name: coverage
        run: cargo llvm-cov --all-targets --html --output-dir target/coverage --fail-under-lines 92
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage/html
