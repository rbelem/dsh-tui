[package]
name = "dsh-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI client for the deepseek-harness gateway (parity with the web UI)"
license = "MIT"
exclude = ["bundle", "scripts"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
ratatui = "0.30"
# ratatui-image 11.x is the ratatui 0.30-compatible line (its crossterm dep is
# dev-only; image-defaults adds jpeg/webp/gif decode next to png — the four
# media types of the wire's imageMediaTypeSchema). default-features = false
# drops chafa-dyn (would need system libchafa via pkg-config); the crossterm
# backend feature comes from our own ratatui dep.
ratatui-image = { version = "11.0.6", default-features = false, features = ["image-defaults"] }
# Same 0.25 line ratatui-image pins, so DynamicImage types unify; the four
# wire media types (png/jpeg/webp/gif).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = "0.13"
unicode-width = "0.2"
base64 = { version = "0.22", default-features = false, features = ["std"] }
crossterm = "0.28"
toml = "0.8"
dirs = "6"

[dev-dependencies]
insta = "1"
portable-pty = "0.8"

# Faster dev builds: line tables keep backtraces working while dropping full
# DWARF, and packed debuginfo keeps macOS links snappy (harmless on Linux).
# Tests don't need full debug info, so CI is unaffected.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"
