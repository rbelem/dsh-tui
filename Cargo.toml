[package]
name = "dsh-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI client for the deepseek-harness gateway (parity with the web UI)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
