[package]
name = "dsh-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI client for the deepseek-harness gateway (parity with the web UI)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
ratatui = "0.30"
pulldown-cmark = "0.13"
# regex-fancy: syntect 5.3 needs a regex backend (regex-onig would drag in a
# C build; fancy-regex is pure Rust).
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
crossterm = "0.28"
toml = "0.8"
dirs = "6"

[dev-dependencies]
insta = "1"
portable-pty = "0.8"
